<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>N&amp;U Logo — Material Assemble Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #060a12; color: #e8d9b0;
    font-family: 'Jost', sans-serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 20px;
  }
  h1 { font-size: 15px; letter-spacing: 4px; font-weight: 400; opacity: .75; margin: 0; text-transform: uppercase; }
  #stage {
    position: relative; width: min(92vw, 560px); aspect-ratio: 1/1;
    border-radius: 12px; overflow: hidden; background: #0a1424;
    box-shadow: 0 0 60px rgba(196,154,69,.15);
  }
  #c, #final { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #final { opacity: 0; transition: opacity 1s ease; }
  #shine {
    position: absolute; inset: -20%; pointer-events: none; opacity: 0;
    background: linear-gradient(115deg, transparent 42%, rgba(255,240,200,.35) 50%, transparent 58%);
    transform: translateX(-120%);
  }
  #shine.go { opacity: 1; transition: transform 1.4s ease, opacity .3s ease; transform: translateX(120%); }
  #replay {
    background: transparent; border: 1px solid #C49A45; color: #C49A45;
    padding: 10px 26px; border-radius: 999px; font-size: 14px; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
  }
  #replay:active { transform: scale(.97); }
  p.hint { font-size: 12px; opacity: .5; margin: 0; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>N&amp;U &mdash; Material Assemble</h1>
  <div id="stage">
    <canvas id="c"></canvas>
    <img id="final" src="nu-logo-final.webp" alt="N&U logo" />
    <div id="shine"></div>
  </div>
  <button id="replay">PHIR SE CHALAO</button>
  <p class="hint">preview only &mdash; site par nahi lagaya</p>

<script>
(function () {
  var S = 420;                       // internal particle grid
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var finalImg = document.getElementById('final');
  var shine = document.getElementById('shine');
  canvas.width = S; canvas.height = S;

  var parts = [], maxT = 0, raf = null, T0 = 0;
  var MAXP = 8000;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function build() {
    var off = document.createElement('canvas');
    off.width = S; off.height = S;
    var octx = off.getContext('2d');
    var im = new Image();
    im.onload = function () {
      // cover-fit draw
      var s = Math.max(S / im.width, S / im.height);
      var w = im.width * s, h = im.height * s;
      octx.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
      var d = octx.getImageData(0, 0, S, S).data;
      var cand = [];
      for (var y = 0; y < S; y += 2) {
        for (var x = 0; x < S; x += 2) {
          var i = (y * S + x) * 4;
          var br = (d[i] + d[i + 1] + d[i + 2]) / 3;
          if (br > 42) cand.push({ x: x, y: y, r: d[i], g: d[i + 1], b: d[i + 2] });
        }
      }
      // subsample to cap
      parts = [];
      var step = Math.max(1, cand.length / MAXP);
      for (var k = 0; k < cand.length; k += step) {
        var p = cand[(k | 0) % cand.length];
        var ang = Math.random() * Math.PI * 2;
        var rad = S * (0.55 + Math.random() * 0.75);
        var dx = p.x - S / 2, dy = p.y - S / 2;
        var dist = Math.sqrt(dx * dx + dy * dy) / (S / 2);
        parts.push({
          sx: S / 2 + Math.cos(ang) * rad,
          sy: S / 2 + Math.sin(ang) * rad,
          tx: p.x, ty: p.y,
          c: 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')',
          delay: 0.25 + dist * 1.1 + Math.random() * 0.35,
          dur: 1.3 + Math.random() * 1.1
        });
      }
      maxT = 0;
      for (var j = 0; j < parts.length; j++)
        maxT = Math.max(maxT, parts[j].delay + parts[j].dur);
      play();
    };
    im.src = 'nu-logo-final.webp';
  }

  function frame(now) {
    var T = (now - T0) / 1000;
    ctx.clearRect(0, 0, S, S);
    var done = true;
    for (var j = 0; j < parts.length; j++) {
      var p = parts[j];
      var lt = (T - p.delay) / p.dur;
      if (lt < 0) { done = false; continue; }
      if (lt > 1) lt = 1; else done = false;
      var e = easeOutCubic(lt);
      var x = p.sx + (p.tx - p.sx) * e;
      var y = p.sy + (p.ty - p.sy) * e;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.min(1, lt * 3);
      ctx.fillRect(x, y, 2.4, 2.4);
    }
    ctx.globalAlpha = 1;
    if (!done) { raf = requestAnimationFrame(frame); }
    else {
      // settle: reveal exact image + shine sweep
      finalImg.style.opacity = '1';
      setTimeout(function () {
        shine.classList.remove('go');
        void shine.offsetWidth;
        shine.classList.add('go');
      }, 700);
    }
  }

  function play() {
    if (raf) cancelAnimationFrame(raf);
    finalImg.style.opacity = '0';
    shine.classList.remove('go');
    T0 = performance.now();
    raf = requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click', play);
  build();
})();
</script>
</body>
</html>
